[buildout]
show-picked-versions = true
extensions =
    mr.developer

sources-dir = devel

extends =
    https://dist.plone.org/release/6.2.3/versions.cfg
    https://dist.plone.org/release/6.2.3/versions-ecosystem.cfg
    https://dist.plone.org/release/6.2.3/versions-extra.cfg
    
    https://raw.githubusercontent.com/IMIO/buildout.smartweb/refs/heads/plone62/versions.cfg
    https://raw.githubusercontent.com/IMIO/buildout.smartweb/plone62/sources.cfg

parts =
    instance
#     releaser
    omelette
    plone-helper-scripts
    vscode

develop = .

auto-checkout +=
    imio.smartweb.locales

[instance]
recipe = plone.recipe.zope2instance
zodb-temporary-storage = off
user = admin:admin
http-address = 8080
environment-vars =
    zope_i18n_compile_mo_files true
eggs =
    Plone
    Pillow
    imio.smartweb.common
zcml =
    imio.smartweb.common

[vscode]
recipe = collective.recipe.vscode
eggs = ${instance:eggs}
autocomplete-use-omelette = True

[omelette]
recipe = collective.recipe.omelette
eggs = ${instance:eggs}

[releaser]
recipe = zc.recipe.egg
eggs = zest.releaser

[plone-helper-scripts]
recipe = zc.recipe.egg
eggs =
   Products.CMFPlone
   ${instance:eggs}
interpreter = zopepy
scripts =
   zopepy

[versions]
# Don't use a released version of imio.smartweb.common
imio.smartweb.common =
# Pin the pre-release explicitly: buildout's prefer-final skips it otherwise
imio.omnia.core = 1.0a2
# buildout.smartweb's versions.cfg (extended above) still pins the Plone
# 6.2.2.1 stack and overrides these Plone 6.2.3 / Zope 6.2 pins with lower
# versions: restore them. Remove once buildout.smartweb moves to Plone 6.2.3.
anyio = 4.14.2
certifi = 2026.10.23
more-itertools = 11.1.0
pip = 26.3
plone.app.content = 5.0.1
plone.autoform = 3.0.1
plone.restapi = 10.2.1
typing-extensions = 4.16.0
z3c.form = 6.1
# robotframework-browser 20.6.0 (pinned by Plone 6.2.3) requires this exact
# version; buildout.smartweb pins 7.36.2
protobuf = 7.35.1
